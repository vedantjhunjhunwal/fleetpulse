name: CI

on:
  push:
  pull_request:

jobs:
  decoder:
    name: C decoder (tests + sanitizers + throughput)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (Release, -Werror)
        run: cmake -S decoder -B decoder/build -DCMAKE_BUILD_TYPE=Release && cmake --build decoder/build -j
      - name: Unit tests
        run: ctest --test-dir decoder/build --output-on-failure
      - name: Unit tests under AddressSanitizer + UBSan
        run: |
          cmake -S decoder -B decoder/build-asan -DCMAKE_BUILD_TYPE=Debug -DJ1939_SANITIZE=ON
          cmake --build decoder/build-asan -j
          ./decoder/build-asan/test_j1939
      - name: Simulator tests
        run: pip install pytest && python -m pytest -q simulator/tests
      - name: Throughput (>= 1M frames/s)
        run: python simulator/fleetsim.py --out data --trucks 24 --days 60 && tools/check_bench.sh data 1.0

  api:
    name: .NET 8 API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build the C library used through P/Invoke
        run: cmake -S decoder -B decoder/build -DCMAKE_BUILD_TYPE=Release && cmake --build decoder/build -j --target j1939
      - name: Unit + HTTP integration tests
        run: dotnet run --project api/FleetPulse.Api.Tests -c Release

  analytics:
    name: R analytics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true  # prebuilt Linux binaries from Posit Package Manager
      - name: Install packages
        run: Rscript -e 'install.packages(c("testthat", "jsonlite"))'
      - name: testthat
        working-directory: analytics/tests
        run: Rscript testthat.R

  dashboard:
    name: Angular dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Unit tests (headless Chrome)
        run: npx ng test --watch=false --browsers=ChromeHeadlessCI
      - name: Production build
        run: npx ng build

  traceability:
    name: Requirements traceability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/trace.py
